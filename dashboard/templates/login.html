<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập | Music Data Collector Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-base);
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 12px;
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .auth-btn {
      width: 100%;
      margin-top: 12px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-dim);
    }
    .alert-box {
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 12px;
      margin-bottom: 20px;
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 28px;">🎵</div>
      <div class="auth-title">Collector Studio</div>
      <div class="auth-subtitle">Pipeline & Data Operations</div>
    </div>

    {% if error %}
    <div class="alert-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="input-field" placeholder="Nhập tên đăng nhập..." required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="input-field" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary auth-btn">Secure Login</button>
    </form>

    <div class="auth-footer">
      <div>Hệ thống quản trị nội bộ dành riêng cho ĐATN.</div>
      <div style="margin-top: 4px;">Liên hệ Admin để được cấp quyền.</div>
    </div>
  </div>
</body>
</html>
